version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      dev-tooling:
        patterns:
          - "phpunit/*"
          - "phpstan*"
          - "squizlabs/*"
          - "wp-coding-standards/*"
          - "szepeviktor/*"
          - "phpcsstandards/*"
          - "dealerdirect/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
